<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --error-color: #f72585;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark-color);
        }
        
        .calculator {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }
        
        .calculator-header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .calculator-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .calculator-subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .calculator-body {
            padding: 25px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(72, 149, 239, 0.2);
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .calc-button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .calc-button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .calc-button:active {
            transform: translateY(0);
        }
        
        .calc-button i {
            margin-right: 8px;
        }
        
        .result-container {
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
        }
        
        .result-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .result-value {
            font-size: 1.4rem;
            font-weight: 600;
            word-break: break-all;
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
        
        .history {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .history-title {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--dark-color);
        }
        
        .history-item {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            font-size: 0.9rem;
        }
        
        @media (max-width: 480px) {
            .calculator {
                border-radius: 0;
                min-height: 100vh;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="calculator">
        <div class="calculator-header">
            <h1 class="calculator-title">Простой калькулятор</h1>
            <p class="calculator-subtitle">Выполняет основные арифметические операции</p>
        </div>
        
        <div class="calculator-body">
            <div class="input-group">
                <label class="input-label" for="num1">Первое число:</label>
                <input type="number" id="num1" class="input-field" placeholder="Введите число">
                <div id="error1" class="error-message">Пожалуйста, введите число</div>
            </div>
            
            <div class="input-group">
                <label class="input-label" for="num2">Второе число:</label>
                <input type="number" id="num2" class="input-field" placeholder="Введите число">
                <div id="error2" class="error-message">Пожалуйста, введите число</div>
            </div>
            
            <div class="buttons-grid">
                <button class="calc-button" onclick="calculate('sum')">
                    <i class="fas fa-plus"></i> Сумма
                </button>
                <button class="calc-button" onclick="calculate('subtract')">
                    <i class="fas fa-minus"></i> Разность
                </button>
                <button class="calc-button" onclick="calculate('multiply')">
                    <i class="fas fa-times"></i> Произведение
                </button>
                <button class="calc-button" onclick="calculate('divide')">
                    <i class="fas fa-divide"></i> Деление
                </button>
            </div>
            
            <div class="result-container">
                <div class="result-label">Результат:</div>
                <div id="result" class="result-value">—</div>
            </div>
            
            <div class="history">
                <div class="history-title">История операций:</div>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <script>
        const history = [];
        
        function calculate(operation) {
            const num1Input = document.getElementById('num1');
            const num2Input = document.getElementById('num2');
            const error1 = document.getElementById('error1');
            const error2 = document.getElementById('error2');
            const resultDiv = document.getElementById('result');
            const historyList = document.getElementById('history-list');
            
            // Сброс ошибок
            error1.style.display = 'none';
            error2.style.display = 'none';
            
            const num1 = parseFloat(num1Input.value);
            const num2 = parseFloat(num2Input.value);
            
            // Валидация
            if (isNaN(num1)) {
                error1.style.display = 'block';
                num1Input.focus();
                return;
            }
            
            if (isNaN(num2)) {
                error2.style.display = 'block';
                num2Input.focus();
                return;
            }
            
            let result;
            let operationSymbol;
            
            switch (operation) {
                case 'sum':
                    result = num1 + num2;
                    operationSymbol = '+';
                    break;
                case 'subtract':
                    result = num1 - num2;
                    operationSymbol = '-';
                    break;
                case 'multiply':
                    result = num1 * num2;
                    operationSymbol = '×';
                    break;
                case 'divide':
                    if (num2 === 0) {
                        resultDiv.textContent = "Ошибка: деление на ноль!";
                        resultDiv.style.color = 'var(--error-color)';
                        return;
                    }
                    result = num1 / num2;
                    operationSymbol = '÷';
                    break;
            }
            
            // Форматирование результата
            const formattedResult = Number.isInteger(result) ? result : result.toFixed(4);
            resultDiv.textContent = formattedResult;
            resultDiv.style.color = 'var(--dark-color)';
            
            // Добавление в историю
            const operationText = `${num1} ${operationSymbol} ${num2} = ${formattedResult}`;
            history.unshift(operationText);
            
            if (history.length > 5) {
                history.pop();
            }
            
            // Обновление истории
            historyList.innerHTML = '';
            history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = item;
                historyList.appendChild(historyItem);
            });
        }
        
        // Добавляем обработчики для очистки ошибок при вводе
        document.getElementById('num1').addEventListener('input', function() {
            document.getElementById('error1').style.display = 'none';
        });
        
        document.getElementById('num2').addEventListener('input', function() {
            document.getElementById('error2').style.display = 'none';
        });
    </script>
</body>
</html>
